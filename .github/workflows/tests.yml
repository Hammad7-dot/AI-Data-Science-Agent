name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Build sandbox for real container tests
        if: runner.os == 'Linux'
        run: docker build -t ai-ds-agent-sandbox:latest -f docker/sandbox.Dockerfile .
      - run: python -m pytest tests/ -q
